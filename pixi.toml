# Environment for reviewing and running the single-column stochastic moisture
# model of Martinez-Villalobos and Neelin (2019, J. Atmos. Sci.).
#
#   pixi install
#   pixi run -e dev test            # tests of both notebooks' model code
#   pixi run check                  # the review's comparison of the 2023 notebook with the paper
#   pixi run jupyter lab stoch_rain_model.ipynb

[workspace]
name = "stoch-rain-model"
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64"]
requires-pixi = ">=0.81.0"

[dependencies]
python = "3.12.*"
numpy = "*"
scipy = "*"
matplotlib-base = ">=3.11"
numba = "*"
cmcrameri = "*"
jupyter = "*"
nbconvert = "*"
ipykernel = "*"
# puffins's own requirements, taken from conda-forge rather than as wheels;
# faceted, pure Python and not on conda-forge, comes from PyPI with puffins
xarray = "*"
eofs = "*"
pymannkendall = "*"
scikit-learn = "*"
statsmodels = "*"

[pypi-dependencies]
puffins = "==0.3.0"

[tasks]
test = "pytest tests"
check = "python -u scripts/check_against_mv19.py"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"

[environments]
dev = ["dev"]
